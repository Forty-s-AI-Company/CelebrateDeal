name: Staging first-success journey

# O-13 first-success path on the fixed staging alias with synthetic data only:
# invite → register → product → registration form → live → publish → public registration,
# plus provider read-back of the verification and registration confirmation emails
# (Resend test mailboxes). It never starts a checkout, payment or refund.
# Afterwards it deactivates (never deletes) the runner's synthetic merchants (R-10) so the
# staging email job stops sending their reminders; deletion is staging-first-success-cleanup.yml.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit of the immutable Preview deployment
        required: true
        type: string
      deployment_host:
        description: Immutable Preview host recorded by the protected GitHub deployment
        required: true
        type: string

permissions:
  contents: read
  deployments: read

concurrency:
  group: staging-first-success
  cancel-in-progress: false

jobs:
  first-success:
    if: ${{ github.ref == 'refs/heads/master' && github.ref_protected }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Preview – celebrate-deal-staging
    env:
      CELEBRATEDEAL_SOURCE_SHA: ${{ inputs.source_sha }}
      CELEBRATEDEAL_DEPLOYMENT_HOST: ${{ inputs.deployment_host }}
    steps:
      - name: Checkout protected first-success runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies and Chromium before secret injection
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Test fixed first-success contract before secret injection
        run: node --test scripts/staging-first-success.test.mjs scripts/staging-first-success-trace.test.mjs scripts/staging-first-success-cleanup.test.mjs

      # Same lineage and alias proofs as staging-funnel-smoke.yml; every request targets the alias.
      - name: Verify exact Preview lineage before secret injection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/mvp-payuni-sandbox-e2e.mjs --verify-lineage

      - name: Verify fixed staging alias before owner secret injection
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/staging-browser-smoke.mjs --verify-alias

      - name: Walk the first-success journey through fixed staging
        id: journey
        # Below the job timeout, so a hung journey still leaves time for the deactivate step.
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
          # The runner never calls the shared email job while scheduled jobs are paused.
          SCHEDULED_JOBS_PAUSED: ${{ vars.SCHEDULED_JOBS_PAUSED }}
        run: node scripts/staging-first-success.mjs

      # R-10: suspend this run's (and any earlier run's) synthetic merchant through the F-036 switch,
      # so queued reminders are never sent. Deactivate only: deletion after the 7-day retention is the
      # manual staging-first-success-cleanup.yml. Runs whenever the journey step ran, even if it failed.
      - name: Deactivate synthetic first-success merchants
        if: ${{ !cancelled() && steps.journey.outcome != 'skipped' }}
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
        run: node scripts/staging-first-success-cleanup.mjs --mode=deactivate

      - name: Upload de-identified first-success receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: celebratedeal-staging-first-success
          path: |
            ${{ runner.temp }}/celebratedeal-staging-first-success.json
            ${{ runner.temp }}/celebratedeal-staging-first-success-trace.json
            ${{ runner.temp }}/celebratedeal-staging-first-success-cleanup-deactivate.json
          if-no-files-found: ignore
          retention-days: 14
