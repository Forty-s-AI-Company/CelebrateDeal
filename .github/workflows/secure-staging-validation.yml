name: Secure staging validation

on:
  workflow_dispatch:
    inputs:
      task:
        description: Fixed trusted-runner task
        required: true
        type: choice
        options:
          - wp2-readonly-restore
          - wp4-payuni-sandbox-binding-preflight
          - wp4-payuni-sandbox-reconciliation
          - wp4-payuni-sandbox-refund-recovery
      source_sha:
        description: Exact 40-character Preview source SHA
        required: true
        type: string
      deployment_host:
        description: Exact Vercel Preview hostname without scheme or path
        required: true
        type: string

permissions:
  contents: read
  deployments: read

concurrency:
  group: secure-staging-${{ inputs.task }}
  cancel-in-progress: false

jobs:
  trusted-runner:
    # Feature-branch workflow edits cannot obtain secrets.
    if: ${{ github.ref == 'refs/heads/master' && github.ref_protected }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Preview – celebrate-deal-staging
    steps:
      - name: Checkout protected trusted runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Preload isolated PostgreSQL tooling before secret injection
        if: ${{ inputs.task == 'wp2-readonly-restore' }}
        run: docker pull postgres:17-alpine

      # Browser binaries are fetched before the secret-aware WP4 step. The
      # execution step below is therefore the only step that can receive the
      # Sandbox test bindings.
      - name: Preload Chromium before WP4 secret injection
        if: ${{ inputs.task == 'wp4-payuni-sandbox-reconciliation' }}
        run: npx playwright install --with-deps chromium

      - name: Verify secure runner contract
        run: npm run secure:staging:contract

      - name: Execute fixed WP2 task with bounded egress
        if: ${{ inputs.task == 'wp2-readonly-restore' }}
        id: execute-wp2
        continue-on-error: true
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          CELEBRATEDEAL_SOURCE_SHA: ${{ inputs.source_sha }}
          CELEBRATEDEAL_DEPLOYMENT_HOST: ${{ inputs.deployment_host }}
        run: |
          set -euo pipefail

          firewall_backup="$RUNNER_TEMP/celebratedeal-iptables.rules"
          hosts_backup="$RUNNER_TEMP/celebratedeal-hosts.original"
          destinations="$RUNNER_TEMP/celebratedeal-egress.tsv"
          hosts_file="$RUNNER_TEMP/celebratedeal-hosts"
          : > "$destinations"
          : > "$hosts_file"

          node <<'NODE' > "$destinations"
          const required = ["STAGING_DATABASE_URL", "CELEBRATEDEAL_DEPLOYMENT_HOST"];
          if (required.some((key) => !process.env[key])) process.exit(2);
          const database = new URL(process.env.STAGING_DATABASE_URL);
          const deploymentHost = process.env.CELEBRATEDEAL_DEPLOYMENT_HOST;
          const safeHost = /^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/u;
          if (!safeHost.test(database.hostname) || !safeHost.test(deploymentHost) || !deploymentHost.endsWith(".vercel.app")) process.exit(2);
          const port = database.port || "5432";
          if (!/^\d{2,5}$/u.test(port)) process.exit(2);
          process.stdout.write([
            ["api.github.com", "443"],
            [deploymentHost, "443"],
            [database.hostname, port],
          ].map((row) => row.join("\t")).join("\n") + "\n");
          NODE

          while IFS=$'\t' read -r host port; do
            mapfile -t addresses < <(getent ahostsv4 "$host" | awk '{print $1}' | sort -u)
            if (( ${#addresses[@]} == 0 )); then
              echo "secure_egress_resolution=BLOCKED"
              exit 2
            fi
            for address in "${addresses[@]}"; do
              printf '%s\t%s\t%s\n' "$host" "$address" "$port" >> "$hosts_file"
            done
          done < "$destinations"

          sudo iptables-save > "$firewall_backup"
          sudo cp /etc/hosts "$hosts_backup"
          restore_network() {
            sudo iptables-restore < "$firewall_backup"
            sudo cp "$hosts_backup" /etc/hosts
            rm -f "$firewall_backup" "$hosts_backup" "$destinations" "$hosts_file"
          }
          trap restore_network EXIT

          while IFS=$'\t' read -r host address _port; do
            printf '%s %s\n' "$address" "$host" | sudo tee -a /etc/hosts > /dev/null
          done < "$hosts_file"

          sudo iptables -F OUTPUT
          sudo iptables -P OUTPUT DROP
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          while IFS=$'\t' read -r _host address port; do
            sudo iptables -A OUTPUT -p tcp -d "$address" --dport "$port" -j ACCEPT
          done < "$hosts_file"

          npm run secure:staging:wp2

      - name: Validate fixed WP4 dispatch identity before secret injection
        if: ${{ inputs.task == 'wp4-payuni-sandbox-reconciliation' || inputs.task == 'wp4-payuni-sandbox-binding-preflight' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CELEBRATEDEAL_SOURCE_SHA: ${{ inputs.source_sha }}
          CELEBRATEDEAL_DEPLOYMENT_HOST: ${{ inputs.deployment_host }}
        run: |
          set -euo pipefail

          node scripts/mvp-payuni-sandbox-e2e.mjs --verify-lineage

      - name: Validate fixed existing-refund recovery identity before JOB binding
        if: ${{ inputs.task == 'wp4-payuni-sandbox-refund-recovery' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CELEBRATEDEAL_SOURCE_SHA: ${{ inputs.source_sha }}
          CELEBRATEDEAL_DEPLOYMENT_HOST: ${{ inputs.deployment_host }}
        run: |
          set -euo pipefail

          # Verify execution against the exact current Preview. The recovery
          # endpoint owns the immutable historical transaction source.
          node scripts/mvp-payuni-sandbox-e2e.mjs --verify-lineage

      - name: Validate fixed WP4 Sandbox bindings without execution
        if: ${{ inputs.task == 'wp4-payuni-sandbox-binding-preflight' }}
        shell: bash
        env:
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
          PAYUNI_SANDBOX_ONETIME_CARD_NO: ${{ secrets.PAYUNI_SANDBOX_ONETIME_CARD_NO }}
          PAYUNI_TEST_EXPIRY: ${{ secrets.PAYUNI_TEST_EXPIRY }}
          PAYUNI_TEST_CVV: ${{ secrets.PAYUNI_TEST_CVV }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const required = [
            "JOB_SECRET",
            "PAYUNI_SANDBOX_ONETIME_CARD_NO",
            "PAYUNI_TEST_EXPIRY",
            "PAYUNI_TEST_CVV",
          ];
          const missing = required.filter((key) => !process.env[key]);
          if (missing.length > 0) {
            const names = missing.join(",");
            process.stdout.write(`::error title=WP4 Sandbox binding preflight::Missing fixed bindings: ${names}\n`);
            process.stdout.write(`secure_wp4_missing_bindings=${names}\n`);
            process.exit(2);
          }
          process.stdout.write("secure_wp4_bindings=PASS\n");
          NODE

      - name: Execute fixed WP4 PayUni Sandbox task with bounded egress
        if: ${{ inputs.task == 'wp4-payuni-sandbox-reconciliation' }}
        id: execute-wp4
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
          PAYUNI_SANDBOX_ONETIME_CARD_NO: ${{ secrets.PAYUNI_SANDBOX_ONETIME_CARD_NO }}
          PAYUNI_TEST_EXPIRY: ${{ secrets.PAYUNI_TEST_EXPIRY }}
          PAYUNI_TEST_CVV: ${{ secrets.PAYUNI_TEST_CVV }}
          PAYUNI_ENV: sandbox
          CELEBRATEDEAL_SOURCE_SHA: ${{ inputs.source_sha }}
          CELEBRATEDEAL_DEPLOYMENT_HOST: ${{ inputs.deployment_host }}
        run: |
          set -euo pipefail

          firewall_backup="$RUNNER_TEMP/celebratedeal-wp4-iptables.rules"
          hosts_backup="$RUNNER_TEMP/celebratedeal-wp4-hosts.original"
          destinations="$RUNNER_TEMP/celebratedeal-wp4-egress.tsv"
          hosts_file="$RUNNER_TEMP/celebratedeal-wp4-hosts"
          : > "$destinations"
          : > "$hosts_file"

          node <<'NODE' > "$destinations"
          const required = [
            "CELEBRATEDEAL_DEPLOYMENT_HOST",
            "JOB_SECRET",
            "PAYUNI_SANDBOX_ONETIME_CARD_NO",
            "PAYUNI_TEST_EXPIRY",
            "PAYUNI_TEST_CVV",
          ];
          if (required.some((key) => !process.env[key])) process.exit(2);
          const deploymentHost = process.env.CELEBRATEDEAL_DEPLOYMENT_HOST;
          const safeHost = /^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/u;
          if (!safeHost.test(deploymentHost) || !deploymentHost.endsWith(".vercel.app")) process.exit(2);
          process.stdout.write([
            ["api.github.com", "443"],
            [deploymentHost, "443"],
            ["sandbox-api.payuni.com.tw", "443"],
            ["sandbox-vendor.payuni.com.tw", "443"],
          ].map((row) => row.join("\t")).join("\n") + "\n");
          NODE

          while IFS=$'\t' read -r host port; do
            # Preserve the resolver's preferred CDN edge order while removing
            # getent's repeated STREAM/DGRAM/RAW rows.
            mapfile -t addresses < <(getent ahostsv4 "$host" | awk '!seen[$1]++ { print $1 }')
            if (( ${#addresses[@]} == 0 )); then
              echo "secure_wp4_egress_resolution=BLOCKED"
              exit 2
            fi
            for address in "${addresses[@]}"; do
              printf '%s\t%s\t%s\n' "$host" "$address" "$port" >> "$hosts_file"
            done
          done < "$destinations"

          sudo iptables-save > "$firewall_backup"
          sudo cp /etc/hosts "$hosts_backup"
          restore_network() {
            sudo iptables-restore < "$firewall_backup"
            sudo cp "$hosts_backup" /etc/hosts
            rm -f "$firewall_backup" "$hosts_backup" "$destinations" "$hosts_file"
          }
          trap restore_network EXIT

          while IFS=$'\t' read -r host address _port; do
            printf '%s %s\n' "$address" "$host" | sudo tee -a /etc/hosts > /dev/null
          done < "$hosts_file"

          sudo iptables -F OUTPUT
          sudo iptables -P OUTPUT DROP
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          while IFS=$'\t' read -r _host address port; do
            sudo iptables -A OUTPUT -p tcp -d "$address" --dport "$port" -j ACCEPT
          done < "$hosts_file"

          npm run secure:staging:wp4

      - name: Recover fixed existing WP4 buyer refund with bounded egress
        if: ${{ inputs.task == 'wp4-payuni-sandbox-refund-recovery' }}
        id: execute-wp4-existing-refund-recovery
        continue-on-error: true
        shell: bash
        env:
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
          CELEBRATEDEAL_SOURCE_SHA: ${{ inputs.source_sha }}
          CELEBRATEDEAL_DEPLOYMENT_HOST: ${{ inputs.deployment_host }}
        run: |
          set -euo pipefail

          firewall_backup="$RUNNER_TEMP/celebratedeal-wp4-recovery-iptables.rules"
          firewall6_backup="$RUNNER_TEMP/celebratedeal-wp4-recovery-ip6tables.rules"
          hosts_backup="$RUNNER_TEMP/celebratedeal-wp4-recovery-hosts.original"
          destinations="$RUNNER_TEMP/celebratedeal-wp4-recovery-egress.tsv"
          hosts_file="$RUNNER_TEMP/celebratedeal-wp4-recovery-hosts"
          : > "$destinations"
          : > "$hosts_file"

          node <<'NODE' > "$destinations"
          const required = ["CELEBRATEDEAL_DEPLOYMENT_HOST", "CELEBRATEDEAL_SOURCE_SHA", "JOB_SECRET"];
          if (required.some((key) => !process.env[key])) process.exit(2);
          if (process.env.CELEBRATEDEAL_SOURCE_SHA !== "1052a46d002149b5c06104927ed0fab32b049214") process.exit(2);
          const deploymentHost = process.env.CELEBRATEDEAL_DEPLOYMENT_HOST;
          const safeHost = /^(?=.{1,253}$)[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.vercel\.app$/u;
          if (!safeHost.test(deploymentHost)) process.exit(2);
          process.stdout.write([
            ["api.github.com", "443"],
            [deploymentHost, "443"],
          ].map((row) => row.join("\t")).join("\n") + "\n");
          NODE

          while IFS=$'\t' read -r host port; do
            mapfile -t addresses < <(getent ahostsv4 "$host" | awk '!seen[$1]++ { print $1 }')
            if (( ${#addresses[@]} == 0 )); then
              echo "secure_wp4_recovery_egress_resolution=BLOCKED"
              exit 2
            fi
            for address in "${addresses[@]}"; do
              printf '%s\t%s\t%s\n' "$host" "$address" "$port" >> "$hosts_file"
            done
          done < "$destinations"

          sudo iptables-save > "$firewall_backup"
          sudo ip6tables-save > "$firewall6_backup"
          sudo cp /etc/hosts "$hosts_backup"
          restore_network() {
            sudo iptables-restore < "$firewall_backup"
            sudo ip6tables-restore < "$firewall6_backup"
            sudo cp "$hosts_backup" /etc/hosts
            rm -f "$firewall_backup" "$firewall6_backup" "$hosts_backup" "$destinations" "$hosts_file"
          }
          trap restore_network EXIT

          while IFS=$'\t' read -r host address _port; do
            printf '%s %s\n' "$address" "$host" | sudo tee -a /etc/hosts > /dev/null
          done < "$hosts_file"

          sudo iptables -F OUTPUT
          sudo iptables -P OUTPUT DROP
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          while IFS=$'\t' read -r _host address port; do
            sudo iptables -A OUTPUT -p tcp -d "$address" --dport "$port" -j ACCEPT
          done < "$hosts_file"
          sudo ip6tables -F OUTPUT
          sudo ip6tables -P OUTPUT DROP
          sudo ip6tables -A OUTPUT -o lo -j ACCEPT
          sudo ip6tables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT

          node scripts/mvp-payuni-sandbox-e2e.mjs --recover-existing-refund

      - name: Validate sanitized WP2 receipt
        if: ${{ inputs.task == 'wp2-readonly-restore' }}
        env:
          SECURE_RECEIPT_PATH: ${{ runner.temp }}/celebratedeal-secure-receipts/wp2-readonly-restore-receipt.json
        run: node --import tsx scripts/validate-secure-staging-receipt.mjs "$SECURE_RECEIPT_PATH"

      - name: Validate sanitized WP4 receipt
        if: ${{ inputs.task == 'wp4-payuni-sandbox-reconciliation' }}
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: node scripts/mvp-payuni-sandbox-e2e.mjs --validate-receipt

      - name: Validate sanitized existing-refund recovery receipt
        if: ${{ inputs.task == 'wp4-payuni-sandbox-refund-recovery' }}
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: node scripts/mvp-payuni-sandbox-e2e.mjs --validate-recovery-receipt

      - name: Upload sanitized receipt only
        if: ${{ inputs.task == 'wp2-readonly-restore' || inputs.task == 'wp4-payuni-sandbox-reconciliation' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secure-staging-${{ inputs.task }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/celebratedeal-secure-receipts/${{ inputs.task }}-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload sanitized existing-refund recovery receipt only
        if: ${{ inputs.task == 'wp4-payuni-sandbox-refund-recovery' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secure-staging-${{ inputs.task }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/celebratedeal-secure-receipts/wp4-payuni-sandbox-refund-recovery-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce fixed WP2 task success
        if: ${{ inputs.task == 'wp2-readonly-restore' && steps.execute-wp2.outcome != 'success' }}
        run: exit 2

      - name: Enforce fixed WP4 task success
        if: ${{ inputs.task == 'wp4-payuni-sandbox-reconciliation' && steps.execute-wp4.outcome != 'success' }}
        run: exit 2

      - name: Enforce fixed existing-refund recovery success
        if: ${{ inputs.task == 'wp4-payuni-sandbox-refund-recovery' && steps.execute-wp4-existing-refund-recovery.outcome != 'success' }}
        run: exit 2
