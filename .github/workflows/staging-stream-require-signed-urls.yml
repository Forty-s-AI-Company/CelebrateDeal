name: Staging Stream require signed URLs

# F-093 plan §8 step 5 / rollback step 8 (docs/operations/stream-signed-urls-plan.md) on the fixed
# staging alias only: calls /api/admin/ops/cloudflare/require-signed-urls for one vendor, following
# nextCursor. apply=false is a dry run. The log prints only counts per kind and status (never
# videoId, uid or the job secret); the endpoint itself writes the audit row for every apply.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit of the immutable Preview deployment
        required: true
        type: string
      deployment_host:
        description: Immutable Preview host recorded by the protected GitHub deployment
        required: true
        type: string
      vendor_id:
        description: Staging vendor whose existing videos are changed
        required: true
        default: wp4_synthetic_vendor_v1
        type: string
      mode:
        description: lock sets requireSignedURLs; unlock is the rollback
        required: true
        default: lock
        type: choice
        options:
          - lock
          - unlock
      apply:
        description: false only lists what would change
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  deployments: read

concurrency:
  group: staging-stream-require-signed-urls
  cancel-in-progress: false

jobs:
  backfill:
    if: ${{ github.ref == 'refs/heads/master' && github.ref_protected }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Preview – celebrate-deal-staging
      deployment: false
    env:
      CELEBRATEDEAL_SOURCE_SHA: ${{ inputs.source_sha }}
      CELEBRATEDEAL_DEPLOYMENT_HOST: ${{ inputs.deployment_host }}
      BACKFILL_VENDOR_ID: ${{ inputs.vendor_id }}
      BACKFILL_MODE: ${{ inputs.mode }}
      BACKFILL_APPLY: ${{ inputs.apply }}
    steps:
      - name: Checkout protected runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies before secret injection
        run: npm ci --ignore-scripts

      - name: Verify exact Preview lineage before secret injection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/mvp-payuni-sandbox-e2e.mjs --verify-lineage

      - name: Verify fixed staging alias before secret injection
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/staging-browser-smoke.mjs --verify-alias

      - name: Run signed URL backfill
        env:
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
        run: |
          node --input-type=module <<'EOF'
          const vendorId = process.env.BACKFILL_VENDOR_ID ?? "";
          if (!/^[A-Za-z0-9_-]{1,128}$/u.test(vendorId)) throw new Error("invalid vendor_id");
          const mode = process.env.BACKFILL_MODE === "unlock" ? "unlock" : "lock";
          const apply = process.env.BACKFILL_APPLY === "true";
          const url = "https://celebrate-deal-staging.carry-digital-nomad.in.net/api/admin/ops/cloudflare/require-signed-urls";
          const counts = {};
          let cursor;
          let batches = 0;
          let unaudited = 0;
          do {
            const response = await fetch(url, {
              method: "POST",
              headers: { authorization: `Bearer ${process.env.JOB_SECRET}`, "content-type": "application/json" },
              body: JSON.stringify({ vendorId, mode, apply, ...(cursor ? { cursor } : {}) }),
              signal: AbortSignal.timeout(320_000),
            });
            const body = await response.json().catch(() => ({}));
            if (response.status !== 200 && response.status !== 207) {
              console.log(`stream_signed_urls_backfill=FAIL status:${response.status} diagnostic:${String(body.diagnostic ?? "none").slice(0, 40)}`);
              process.exit(1);
            }
            if (response.status === 207) unaudited += 1;
            for (const result of body.results ?? []) {
              const key = `${String(result.kind).slice(0, 20)}/${String(result.status).slice(0, 20)}`;
              counts[key] = (counts[key] ?? 0) + 1;
            }
            cursor = body.nextCursor ?? undefined;
            batches += 1;
          } while (cursor && batches < 200);
          const summary = Object.entries(counts).map(([key, n]) => `${key}:${n}`).join(",") || "none";
          const failed = Object.keys(counts).some((key) => key.endsWith("/failed"));
          const result = cursor ? "INCOMPLETE" : failed || unaudited ? "PARTIAL" : "PASS";
          console.log(`stream_signed_urls_backfill=${result} mode:${mode} apply:${apply} batches:${batches} unaudited_batches:${unaudited} results:${summary}`);
          if (result !== "PASS") process.exit(1);
          EOF
