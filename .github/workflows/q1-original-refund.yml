name: Q1 fixed original browser refund proof
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed Sandbox Preview source SHA
        required: true
        type: string
      deployment_host:
        description: Exact Sandbox Preview hostname
        required: true
        type: string
permissions:
  contents: read
  deployments: read
concurrency:
  group: q1-fixed-original-refund
  cancel-in-progress: false
jobs:
  diagnose:
    if: ${{ github.ref == 'refs/heads/master' && github.ref_protected }}
    environment: Preview – celebrate-deal-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - name: Validate fixed read-only contract before secrets
        run: npx vitest run scripts/payuni-sandbox-pending-refund-consumer.test.mjs src/lib/staging-qa-finance-bootstrap.test.ts
      - name: Validate CLI startup and sanitized receipts before secrets
        run: node --test scripts/q1-original-refund-handoff.test.mjs scripts/q1-original-refund-workflow.test.mjs
      - name: Install credential-free Chromium before secrets
        run: npx playwright install chromium --with-deps
      - name: Verify exact deployment lineage before secrets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CELEBRATEDEAL_SOURCE_SHA: ${{ inputs.source_sha }}
          CELEBRATEDEAL_DEPLOYMENT_HOST: ${{ inputs.deployment_host }}
        run: node scripts/mvp-payuni-sandbox-e2e.mjs --verify-lineage
      - name: Refund only the fixed recovered original through exact browser UI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CELEBRATEDEAL_SOURCE_SHA: ${{ inputs.source_sha }}
          CELEBRATEDEAL_DEPLOYMENT_HOST: ${{ inputs.deployment_host }}
          PAYUNI_ENV: sandbox
          PAYUNI_SANDBOX_QA_ENABLED: 'true'
          PAYUNI_SANDBOX_REFUND_ENABLED: 'true'
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
          PAYUNI_QA_FINANCE_EMAIL: ${{ secrets.PAYUNI_QA_FINANCE_EMAIL }}
          PAYUNI_QA_FINANCE_PASSWORD: ${{ secrets.PAYUNI_QA_FINANCE_PASSWORD }}
          PAYUNI_QA_FINANCE_OTP: ${{ secrets.PAYUNI_QA_FINANCE_OTP }}
          PAYUNI_SANDBOX_MERCHANT_ID: ${{ secrets.PAYUNI_SANDBOX_MERCHANT_ID }}
          PAYUNI_SANDBOX_HASH_KEY: ${{ secrets.PAYUNI_SANDBOX_HASH_KEY }}
          PAYUNI_SANDBOX_HASH_IV: ${{ secrets.PAYUNI_SANDBOX_HASH_IV }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/q1-original-refund"
          printf '%s\n' '{"schemaVersion":"celebratedeal-q1-original-refund-completion/v1","status":"BLOCKED","stage":"network-configuration","productionOperations":false,"reservationWritten":false,"refundSubmissionMayHaveOccurred":false,"paymentSubmitted":false,"alternateTransactionSelected":false}' > "$RUNNER_TEMP/q1-original-refund/completion.json"
          ip4="$RUNNER_TEMP/q1-original-refund-ip4"
          ip6="$RUNNER_TEMP/q1-original-refund-ip6"
          hosts="$RUNNER_TEMP/q1-original-refund-hosts"
          destinations="$RUNNER_TEMP/q1-original-refund-destinations"
          node <<'NODE' > "$destinations"
          const db = new URL(process.env.STAGING_DATABASE_URL);
          const ref = 'ocbugvgojrunvenozsbx';
          if (!['postgres:', 'postgresql:'].includes(db.protocol)
            || !(db.hostname === `db.${ref}.supabase.co`
              || (db.hostname.endsWith('.pooler.supabase.com') && decodeURIComponent(db.username) === `postgres.${ref}`))) process.exit(2);
          const port = db.port || '5432';
          if (!/^\d{2,5}$/.test(port)) process.exit(2);
          const preview = process.env.CELEBRATEDEAL_DEPLOYMENT_HOST;
          if (!/^[a-z0-9][a-z0-9-]{0,251}\.vercel\.app$/.test(preview || '')) process.exit(2);
          if ([...db.searchParams.keys()].some(key => key === 'host')) process.exit(2);
          process.stdout.write(`sandbox-api.payuni.com.tw\t443\napi.github.com\t443\ncelebrate-deal-staging.carry-digital-nomad.in.net\t443\n${preview}\t443\n${db.hostname}\t${port}\n`);
          NODE
          : > "$hosts"
          while IFS=$'\t' read -r host port; do
            mapfile -t addresses < <(getent ahostsv4 "$host" | awk '{print $1}' | sort -u)
            (( ${#addresses[@]} > 0 )) || exit 2
            for address in "${addresses[@]}"; do
              printf '%s\t%s\t%s\n' "$host" "$address" "$port" >> "$hosts"
            done
          done < "$destinations"
          sudo iptables-save > "$ip4"
          sudo ip6tables-save > "$ip6"
          sudo cp /etc/hosts "$hosts.original"
          restore_network() {
            sudo iptables-restore < "$ip4"
            sudo ip6tables-restore < "$ip6"
            sudo cp "$hosts.original" /etc/hosts
            rm -f "$ip4" "$ip6" "$hosts" "$hosts.original" "$destinations"
          }
          trap restore_network EXIT
          while IFS=$'\t' read -r host address port; do
            printf '%s %s\n' "$address" "$host" | sudo tee -a /etc/hosts > /dev/null
          done < "$hosts"
          sudo iptables -F OUTPUT
          sudo iptables -P OUTPUT DROP
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo ip6tables -F OUTPUT
          sudo ip6tables -P OUTPUT DROP
          sudo ip6tables -A OUTPUT -o lo -j ACCEPT
          sudo ip6tables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          while IFS=$'\t' read -r host address port; do
            sudo iptables -A OUTPUT -p tcp -d "$address" --dport "$port" -j ACCEPT
          done < "$hosts"
          node --import tsx scripts/q1-original-refund-runner.mjs
      - name: Upload fixed sanitized bootstrap result only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q1-original-refund-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/q1-original-refund/completion.json
          if-no-files-found: ignore
          retention-days: 7

