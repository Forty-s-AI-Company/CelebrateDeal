name: CodeQL

# Static analysis for JavaScript/TypeScript (plan item S5). Results appear in
# the repository's Security > Code scanning tab; a pull request gets an alert
# check when it introduces a new finding. Uses the default query suite plus
# security-extended. Triage steps: SECURITY.md.
on:
  pull_request:
    branches: [master]
  merge_group:
  schedule:
    # Wednesdays 09:41 Asia/Taipei.
    - cron: "41 1 * * 3"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
