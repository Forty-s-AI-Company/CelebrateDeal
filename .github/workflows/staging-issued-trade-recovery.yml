name: Staging original issued trade recovery observation
'on':
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed Sandbox Preview SHA with exact refund proof support
        required: true
        type: string
      deployment_host:
        description: Exact reviewed Sandbox Preview hostname
        required: true
        type: string
permissions:
  contents: read
  deployments: read
concurrency:
  group: staging-issued-trade-recovery
  cancel-in-progress: false
jobs:
  observation:
    if: ${{ github.ref == 'refs/heads/master' && github.ref_protected }}
    environment: Preview – celebrate-deal-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - name: Validate bounded observation and exact cleanup before secrets
        run: node --test scripts/payuni-issued-recovery-observation.test.mjs scripts/payuni-issued-recovery-browser.test.mjs scripts/payuni-issued-recovery-runner.test.mjs scripts/staging-issued-trade-recovery.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Verify immutable deployment lineage before secrets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CELEBRATEDEAL_SOURCE_SHA: ${{ inputs.source_sha }}
          CELEBRATEDEAL_DEPLOYMENT_HOST: ${{ inputs.deployment_host }}
        run: node scripts/mvp-payuni-sandbox-e2e.mjs --verify-lineage
      - name: Verify exact reviewed refund proof capability before secrets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CELEBRATEDEAL_SOURCE_SHA: ${{ inputs.source_sha }}
        run: node scripts/payuni-issued-recovery-runner.mjs --verify-refund-proof-source
      - name: Observe failed original Sandbox trade and exact refund cleanup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CELEBRATEDEAL_SOURCE_SHA: ${{ inputs.source_sha }}
          CELEBRATEDEAL_DEPLOYMENT_HOST: ${{ inputs.deployment_host }}
          PAYUNI_ENV: sandbox
          PAYUNI_SANDBOX_QA_ENABLED: 'true'
          PAYUNI_SANDBOX_REFUND_ENABLED: 'true'
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
          PAYUNI_SANDBOX_ONETIME_CARD_NO: ${{ secrets.PAYUNI_SANDBOX_ONETIME_CARD_NO }}
          PAYUNI_TEST_EXPIRY: ${{ secrets.PAYUNI_TEST_EXPIRY }}
          PAYUNI_TEST_CVV: ${{ secrets.PAYUNI_TEST_CVV }}
          PAYUNI_SANDBOX_MERCHANT_ID: ${{ secrets.PAYUNI_SANDBOX_MERCHANT_ID }}
          PAYUNI_SANDBOX_HASH_KEY: ${{ secrets.PAYUNI_SANDBOX_HASH_KEY }}
          PAYUNI_SANDBOX_HASH_IV: ${{ secrets.PAYUNI_SANDBOX_HASH_IV }}
          PAYUNI_QA_FINANCE_EMAIL: ${{ secrets.PAYUNI_QA_FINANCE_EMAIL }}
          PAYUNI_QA_FINANCE_PASSWORD: ${{ secrets.PAYUNI_QA_FINANCE_PASSWORD }}
          PAYUNI_QA_FINANCE_OTP: ${{ secrets.PAYUNI_QA_FINANCE_OTP }}
        shell: bash
        run: |
          set -euo pipefail
          firewall_backup="$RUNNER_TEMP/celebratedeal-issued-iptables.rules"
          firewall6_backup="$RUNNER_TEMP/celebratedeal-issued-ip6tables.rules"
          hosts_backup="$RUNNER_TEMP/celebratedeal-issued-hosts.original"
          destinations="$RUNNER_TEMP/celebratedeal-issued-egress.tsv"
          hosts_file="$RUNNER_TEMP/celebratedeal-issued-hosts"
          : > "$destinations"
          : > "$hosts_file"

          node <<'NODE' > "$destinations"
          const deploymentHost = process.env.CELEBRATEDEAL_DEPLOYMENT_HOST;
          const safeHost = /^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/u;
          if (!safeHost.test(deploymentHost || "") || !deploymentHost.endsWith(".vercel.app")) process.exit(2);
          const destinations = [
            ["api.github.com", "443"],
            [deploymentHost, "443"],
            ["celebrate-deal-staging.carry-digital-nomad.in.net", "443"],
            ["ocbugvgojrunvenozsbx.supabase.co", "443"],
            ["sandbox-api.payuni.com.tw", "443"],
            ["sandbox-vendor.payuni.com.tw", "443"],
          ];
          process.stdout.write(destinations.map((row) => row.join("\t")).join("\n") + "\n");
          NODE

          while IFS=$'\t' read -r host port; do
            mapfile -t addresses < <(getent ahostsv4 "$host" | awk '{print $1}' | sort -u)
            if (( ${#addresses[@]} == 0 )); then
              echo "secure_egress_resolution=BLOCKED"
              exit 2
            fi
            for address in "${addresses[@]}"; do
              printf '%s\t%s\t%s\n' "$host" "$address" "$port" >> "$hosts_file"
            done
          done < "$destinations"

          sudo iptables-save > "$firewall_backup"
          sudo ip6tables-save > "$firewall6_backup"
          sudo cp /etc/hosts "$hosts_backup"
          restore_network() {
            sudo iptables-restore < "$firewall_backup"
            sudo ip6tables-restore < "$firewall6_backup"
            sudo cp "$hosts_backup" /etc/hosts
            rm -f "$firewall_backup" "$firewall6_backup" "$hosts_backup" "$destinations" "$hosts_file"
          }
          trap restore_network EXIT

          while IFS=$'\t' read -r host address _port; do
            printf '%s %s\n' "$address" "$host" | sudo tee -a /etc/hosts > /dev/null
          done < "$hosts_file"

          sudo iptables -F OUTPUT
          sudo iptables -P OUTPUT DROP
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo ip6tables -F OUTPUT
          sudo ip6tables -P OUTPUT DROP
          sudo ip6tables -A OUTPUT -o lo -j ACCEPT
          sudo ip6tables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          while IFS=$'\t' read -r _host address port; do
            sudo iptables -A OUTPUT -p tcp -d "$address" --dport "$port" -j ACCEPT
          done < "$hosts_file"

          mkdir -p "$RUNNER_TEMP/issued-recovery"
          node scripts/payuni-issued-recovery-runner.mjs > "$RUNNER_TEMP/issued-recovery/completion.json"
      - name: Upload sanitized observation result only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issued-trade-recovery-${{ inputs.source_sha }}
          path: |
            ${{ runner.temp }}/issued-recovery/completion.json
            ${{ runner.temp }}/issued-recovery/pending.json
          if-no-files-found: ignore
          retention-days: 7
