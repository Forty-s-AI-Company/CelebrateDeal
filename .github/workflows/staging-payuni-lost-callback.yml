name: Staging PayUni lost-callback reconcile drill

# A4-05: proves /api/jobs/payment-reconcile on staging with PayUni Sandbox.
#   phase=pay    attested deployment only: one fixed NT$1 WP4 synthetic checkout,
#                paid in Sandbox with NotifyURL/ReturnURL withheld, then a
#                read-only proof that the application never posted it.
#   (wait >= 15 minutes, run scheduled-jobs.yml job=payment-reconcile)
#   phase=verify read-only proof that the reconciler posted it exactly once;
#                run it again after another reconcile run for idempotency.
# Runbook: docs/domain-workflows.md「付款通知遺失時的主動查詢（A-2 05）」.
'on':
  workflow_dispatch:
    inputs:
      phase:
        description: pay (one Sandbox payment with the callback withheld) or verify (read-only)
        required: true
        type: choice
        options:
          - pay
          - verify
      source_sha:
        description: Exact 40-character Preview source SHA that owns the drill checkout
        required: true
        type: string
      deployment_host:
        description: Exact Vercel Preview hostname for that SHA (pay phase only)
        required: false
        type: string
        default: ''
permissions:
  contents: read
  deployments: read
concurrency:
  group: staging-payuni-lost-callback
  cancel-in-progress: false
jobs:
  drill:
    if: ${{ github.ref == 'refs/heads/master' && github.ref_protected }}
    environment: Preview – celebrate-deal-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - name: Validate drill contracts before secrets
        run: node --test scripts/payuni-lost-callback-drill.test.mjs scripts/staging-payuni-lost-callback-workflow.test.mjs
      - name: Install Chromium before secrets
        if: ${{ inputs.phase == 'pay' }}
        run: npx playwright install --with-deps chromium
      - name: Verify immutable deployment lineage before secrets
        if: ${{ inputs.phase == 'pay' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CELEBRATEDEAL_SOURCE_SHA: ${{ inputs.source_sha }}
          CELEBRATEDEAL_DEPLOYMENT_HOST: ${{ inputs.deployment_host }}
        run: node scripts/mvp-payuni-sandbox-e2e.mjs --verify-lineage
      - name: Pay in Sandbox with the callback withheld
        id: pay
        if: ${{ inputs.phase == 'pay' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CELEBRATEDEAL_SOURCE_SHA: ${{ inputs.source_sha }}
          CELEBRATEDEAL_DEPLOYMENT_HOST: ${{ inputs.deployment_host }}
          PAYUNI_ENV: sandbox
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
          PAYUNI_SANDBOX_ONETIME_CARD_NO: ${{ secrets.PAYUNI_SANDBOX_ONETIME_CARD_NO }}
          PAYUNI_TEST_EXPIRY: ${{ secrets.PAYUNI_TEST_EXPIRY }}
          PAYUNI_TEST_CVV: ${{ secrets.PAYUNI_TEST_CVV }}
          PAYUNI_SANDBOX_MERCHANT_ID: ${{ secrets.PAYUNI_SANDBOX_MERCHANT_ID }}
          PAYUNI_SANDBOX_HASH_KEY: ${{ secrets.PAYUNI_SANDBOX_HASH_KEY }}
          PAYUNI_SANDBOX_HASH_IV: ${{ secrets.PAYUNI_SANDBOX_HASH_IV }}
        shell: bash
        run: |
          set -euo pipefail
          firewall_backup="$RUNNER_TEMP/celebratedeal-lost-callback-iptables.rules"
          firewall6_backup="$RUNNER_TEMP/celebratedeal-lost-callback-ip6tables.rules"
          hosts_backup="$RUNNER_TEMP/celebratedeal-lost-callback-hosts.original"
          destinations="$RUNNER_TEMP/celebratedeal-lost-callback-egress.tsv"
          hosts_file="$RUNNER_TEMP/celebratedeal-lost-callback-hosts"
          : > "$destinations"
          : > "$hosts_file"

          node <<'NODE' > "$destinations"
          const deploymentHost = process.env.CELEBRATEDEAL_DEPLOYMENT_HOST;
          const safeHost = /^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/u;
          if (!safeHost.test(deploymentHost || "") || !deploymentHost.endsWith(".vercel.app")) process.exit(2);
          // Vercel firewalls the immutable Preview host; requests go to the attested fixed alias.
          const destinations = [
            ["api.github.com", "443"],
            ["celebrate-deal-staging.carry-digital-nomad.in.net", "443"],
            ["sandbox-api.payuni.com.tw", "443"],
            ["sandbox-vendor.payuni.com.tw", "443"],
          ];
          process.stdout.write(destinations.map((row) => row.join("\t")).join("\n") + "\n");
          NODE

          while IFS=$'\t' read -r host port; do
            mapfile -t addresses < <(getent ahostsv4 "$host" | awk '!seen[$1]++ { print $1 }')
            if (( ${#addresses[@]} == 0 )); then
              echo "lost_callback_egress_resolution=BLOCKED"
              exit 2
            fi
            for address in "${addresses[@]}"; do
              printf '%s\t%s\t%s\n' "$host" "$address" "$port" >> "$hosts_file"
            done
          done < "$destinations"

          sudo iptables-save > "$firewall_backup"
          sudo ip6tables-save > "$firewall6_backup"
          sudo cp /etc/hosts "$hosts_backup"
          restore_network() {
            sudo iptables-restore < "$firewall_backup"
            sudo ip6tables-restore < "$firewall6_backup"
            sudo cp "$hosts_backup" /etc/hosts
            rm -f "$firewall_backup" "$firewall6_backup" "$hosts_backup" "$destinations" "$hosts_file"
          }
          trap restore_network EXIT

          while IFS=$'\t' read -r host address _port; do
            printf '%s %s\n' "$address" "$host" | sudo tee -a /etc/hosts > /dev/null
          done < "$hosts_file"

          sudo iptables -F OUTPUT
          sudo iptables -P OUTPUT DROP
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo ip6tables -F OUTPUT
          sudo ip6tables -P OUTPUT DROP
          sudo ip6tables -A OUTPUT -o lo -j ACCEPT
          sudo ip6tables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          while IFS=$'\t' read -r _host address port; do
            sudo iptables -A OUTPUT -p tcp -d "$address" --dport "$port" -j ACCEPT
          done < "$hosts_file"

          node scripts/payuni-lost-callback-drill.mjs
      - name: Read-only proof of the posting state
        if: ${{ !cancelled() }}
        env:
          LOST_CALLBACK_PHASE: ${{ inputs.phase }}
          CELEBRATEDEAL_SOURCE_SHA: ${{ inputs.source_sha }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PAYUNI_ENV: sandbox
          PAYUNI_SANDBOX_MERCHANT_ID: ${{ secrets.PAYUNI_SANDBOX_MERCHANT_ID }}
          PAYUNI_SANDBOX_HASH_KEY: ${{ secrets.PAYUNI_SANDBOX_HASH_KEY }}
          PAYUNI_SANDBOX_HASH_IV: ${{ secrets.PAYUNI_SANDBOX_HASH_IV }}
        run: node --import tsx scripts/payuni-lost-callback-proof.ts
      - name: Enforce the pay phase result
        if: ${{ !cancelled() && inputs.phase == 'pay' && steps.pay.outcome != 'success' }}
        run: exit 2
      - name: Upload sanitized receipts only
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payuni-lost-callback-${{ inputs.phase }}-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/payuni-lost-callback/pay.json
            ${{ runner.temp }}/payuni-lost-callback/pay-proof.json
            ${{ runner.temp }}/payuni-lost-callback/verify-proof.json
          if-no-files-found: ignore
          retention-days: 14
