name: Staging provider read-only probe

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit of the immutable Preview deployment
        required: true
        type: string
      deployment_host:
        description: Immutable Preview host recorded by the protected GitHub deployment
        required: true
        type: string

permissions:
  contents: read
  deployments: read

jobs:
  provider-probe:
    if: ${{ github.ref == 'refs/heads/master' && github.ref_protected }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Preview – celebrate-deal-staging
    env:
      CELEBRATEDEAL_SOURCE_SHA: ${{ inputs.source_sha }}
      CELEBRATEDEAL_DEPLOYMENT_HOST: ${{ inputs.deployment_host }}
    steps:
      - name: Checkout protected read-only probe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Test provider probe contract before secret injection
        run: node --test scripts/staging-provider-readonly-probe.test.mjs

      - name: Verify exact Preview lineage before secret injection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/mvp-payuni-sandbox-e2e.mjs --verify-lineage

      - name: Probe deployed Preview providers read only
        env:
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
        run: node scripts/staging-provider-readonly-probe.mjs

      - name: Upload sanitized provider receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: celebratedeal-staging-provider-readonly-probe
          path: ${{ runner.temp }}/celebratedeal-staging-provider-readonly-probe.json
          if-no-files-found: ignore
          retention-days: 7
