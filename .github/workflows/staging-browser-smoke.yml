name: Staging browser smoke

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit of the immutable Preview deployment
        required: true
        type: string
      deployment_host:
        description: Immutable Preview host recorded by the protected GitHub deployment
        required: true
        type: string
      surface:
        description: Verify the fixed alias or the immutable Preview before cutover
        required: true
        default: fixed_alias
        type: choice
        options:
          - fixed_alias
          - immutable_preview

permissions:
  contents: read
  deployments: read

jobs:
  browser-smoke:
    if: ${{ github.ref == 'refs/heads/master' && github.ref_protected }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Preview – celebrate-deal-staging
    env:
      CELEBRATEDEAL_SOURCE_SHA: ${{ inputs.source_sha }}
      CELEBRATEDEAL_DEPLOYMENT_HOST: ${{ inputs.deployment_host }}
      CELEBRATEDEAL_BROWSER_SURFACE: ${{ inputs.surface }}
    steps:
      - name: Checkout protected browser runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies and Chromium before secret injection
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Test fixed browser contract before secret injection
        run: node --test scripts/staging-browser-smoke.test.mjs

      # deployment_host stays the immutable Preview recorded by GitHub (lineage input only).
      # Vercel firewalls *.vercel.app Preview hosts (403 deny), so --verify-lineage requires a
      # protected-master SHA and then the alias /api/health identity (SHA + host); every request
      # below targets the alias. --verify-alias is the independent Vercel API proof; only when
      # VERCEL_TOKEN cannot read the alias record (401/403/missing) does it repeat that same
      # lineage-step self-attestation, which is NOT a second independent proof.
      # immutable_preview is the explicit pre-cutover mode and still probes the Preview host itself.
      - name: Verify exact Preview lineage before secret injection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/mvp-payuni-sandbox-e2e.mjs --verify-lineage

      - name: Verify fixed staging alias before owner secret injection
        if: ${{ inputs.surface == 'fixed_alias' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/staging-browser-smoke.mjs --verify-alias

      - name: Verify immutable staging Preview before owner secret injection
        if: ${{ inputs.surface == 'immutable_preview' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/staging-browser-smoke.mjs --verify-preview

      # The owner session is short-lived and belongs only to the fixed synthetic fixture.
      - name: Check authenticated staging pages with synthetic owner
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
        run: node scripts/staging-browser-smoke.mjs

      - name: Upload sanitized browser receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: celebratedeal-staging-browser-smoke
          path: ${{ runner.temp }}/celebratedeal-staging-browser-smoke.json
          if-no-files-found: ignore
          retention-days: 7
