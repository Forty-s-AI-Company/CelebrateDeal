name: Staging Stream resource smoke

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit of the immutable Preview deployment
        required: true
        type: string
      deployment_host:
        description: Immutable Preview host recorded by the protected GitHub deployment
        required: true
        type: string

permissions:
  contents: read
  deployments: read

jobs:
  stream-resource-smoke:
    if: ${{ github.ref == 'refs/heads/master' && github.ref_protected }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: Preview – celebrate-deal-staging
    env:
      CELEBRATEDEAL_SOURCE_SHA: ${{ inputs.source_sha }}
      CELEBRATEDEAL_DEPLOYMENT_HOST: ${{ inputs.deployment_host }}
    steps:
      - name: Checkout protected Stream resource runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies before secret injection
        run: |
          npm ci --ignore-scripts
          node --version

      - name: Test fixed Stream resource contract before secret injection
        run: node --test scripts/staging-stream-resource-smoke.test.mjs

      - name: Verify exact Preview lineage before secret injection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/mvp-payuni-sandbox-e2e.mjs --verify-lineage

      - name: Verify fixed staging alias before owner secret injection
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/staging-browser-smoke.mjs --verify-alias

      - name: Exercise one synthetic one-second Stream resource through staging
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          OPS_SMOKE_SECRET: ${{ secrets.OPS_SMOKE_SECRET }}
        run: node scripts/staging-stream-resource-smoke.mjs

      - name: Upload sanitized Stream resource receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: celebratedeal-staging-stream-resource-smoke
          path: ${{ runner.temp }}/celebratedeal-staging-stream-resource.json
          if-no-files-found: ignore
          retention-days: 7

