name: CI

on:
  # F-147 / B09-08: a PR branch push used to run CI twice (push and
  # pull_request). Only master pushes run here; every PR runs pull_request.
  push:
    branches: [master]
  pull_request:
  # The merge queue runs the same required checks on its temporary
  # gh-readonly-queue/master/pr-<n>-<sha> branch before it merges.
  merge_group:
    types: [checks_requested]

# A newer run for the same pull request supersedes an in-flight one. A master
# push keeps one group per merged commit, and every merge-queue entry keeps its
# own group and is never cancelled by another entry: GitHub removes or rebuilds
# queue entries itself.
concurrency:
  group: ci-${{ github.ref }}${{ (github.ref == 'refs/heads/master' || github.event_name == 'merge_group') && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Shared by every job. Each job starts its own disposable PostgreSQL, so these
# synthetic values never point at a shared or deployed database.
env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/celebratedeal_ci?schema=public
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/celebratedeal_ci?schema=public
  NEXT_PUBLIC_APP_URL: https://ci.celebratedeal.local
  JOB_SECRET: ci-job-secret-123456
  CRON_SECRET: ci-cron-secret-123456
  CSRF_SECRET: ci-csrf-fixture-32-bytes-safe-key
  LIVE_CHAT_INGRESS_SECRET: ci-live-chat-ingress-secret-1234567890
  RATE_LIMIT_PROVIDER: cloudflare_waf
  CLOUDFLARE_ACCOUNT_ID: ci-cloudflare-account
  CLOUDFLARE_STREAM_TOKEN: ci-cloudflare-token
  CLOUDFLARE_STREAM_WEBHOOK_SECRET: ci-cloudflare-webhook-secret
  PAYMENT_PROVIDER: demo
  # F-003 (PR #458 review m-5): CI production-mode servers run the demo
  # provider; never set this on a real deployment.
  ALLOW_NON_PAYUNI_PROVIDERS: "1"
  RESEND_API_KEY: ci-resend-key
  EMAIL_FROM: CelebrateDeal CI <ci@celebratedeal.invalid>
  SENTRY_DSN: https://ci@sentry.invalid/1
  NEXT_PUBLIC_POSTHOG_KEY: ci-posthog-key
  NEXT_PUBLIC_POSTHOG_HOST: https://app.posthog.com
  RT01_D2_DISPOSABLE_DB: "true"

# The former single `quality` job runs as parallel jobs on free
# ubuntu-latest runners. Every former step runs in exactly one job with the
# same command and env; only Checkout, the Preview source import and the
# shared setup in .github/actions/ci-setup repeat per job. Branch protection
# requires the final `quality` job, which passes only when every job passed.
jobs:
  static:
    name: Static checks, contracts and build
    runs-on: ubuntu-latest
    # F-146 / B09-07: the default 360 minutes lets a hung run hold a runner.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import fixed Preview source for staging contract tests
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/pull/277/head:refs/remotes/origin/verified-wp2-source
          test "$(git rev-parse refs/remotes/origin/verified-wp2-source)" = '9193326824b8b6bf774bdfa28e4783a1a1b8f304'

      - name: Disposable PostgreSQL, dependencies, Prisma client and migrations
        uses: ./.github/actions/ci-setup

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Repository secret and archive scan
        run: npm run secret:scan

      # F-063 / B04-09: every new migration directory must be named
      # <YYYYMMDDHHMMSS>_<snake_case> and sort after the base branch's newest
      # migration; existing migrations may not be deleted, renamed or edited.
      # A push to master compares against the squash merge's parent.
      - name: Migration name order
        run: node scripts/migration-order-check.mjs
        env:
          MIGRATION_ORDER_BASE_REF: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') && 'HEAD^1' || 'origin/master' }}

      # B04-04: schema.prisma vs migration-built database. Only the drift in
      # scripts/prisma-drift-allowlist.json may remain; Prisma wipes the
      # dedicated shadow database, never celebratedeal_ci.
      - name: Prisma schema drift against migrations
        shell: bash
        run: |
          set -euo pipefail
          shadow_base_url="${DATABASE_URL%\?schema=public}"
          psql "$shadow_base_url" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE celebratedeal_shadow_ci'
          PRISMA_DRIFT_SHADOW_DATABASE_URL="${shadow_base_url%/*}/celebratedeal_shadow_ci?schema=public" node scripts/prisma-drift-check.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: PayUni deployment environment binding contract
        run: npx vitest run src/lib/env.test.ts

      - name: Strict production index access
        run: npm run typecheck:strict-index

      - name: Release readiness contract
        run: npm run test:release-readiness

      - name: Readiness truth reconciliation
        run: node scripts/readiness-truth-reconciliation.mjs

      - name: Staging migration evidence contract
        run: npx vitest run scripts/staging-migration-evidence.test.mjs

      - name: Staging migration receipt validation contract
        run: node --test scripts/validate-staging-migration-evidence.test.mjs

      - name: Staging release evidence aggregation contract
        run: node --test scripts/staging-release-evidence.test.mjs

      - name: Staging release evidence receipt validation contract
        run: node --test scripts/validate-staging-release-evidence.test.mjs

      - name: Human owner acceptance evidence contract
        run: node --test scripts/validate-human-owner-acceptance-evidence.test.mjs

      - name: Release evidence bundle contract
        run: node --test scripts/validate-release-evidence-bundle.test.mjs

      - name: Current release handoff evidence consistency
        run: node --test scripts/current-release-gate-handoff.test.mjs

      - name: External smoke output safety contract
        run: npx vitest run scripts/external-smoke-safety.test.ts

      - name: External provider evidence contract
        run: node --test scripts/external-provider-evidence.test.mjs scripts/validate-external-provider-evidence.test.mjs

      - name: Bounded staging Stream resource contract
        run: node --test scripts/staging-stream-resource-smoke.test.mjs

      - name: Backup tooling static checks
        shell: pwsh
        run: pwsh -NoProfile -File ops/backup/tests/Test-BackupTooling.ps1

      - name: LINE integration contract
        run: npm run test:line

      - name: Node TAP contract tests
        run: npm run test:contracts

      - name: Build
        run: npm run build

      - name: Controlled production preflight and build
        run: node scripts/build/controlled-production-build.mjs

      - name: Preflight
        run: NODE_ENV=production npm run preflight

  unit:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The combined coverage run also executes the Node TAP contracts, which
      # read this source.
      - name: Import fixed Preview source for staging contract tests
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/pull/277/head:refs/remotes/origin/verified-wp2-source
          test "$(git rev-parse refs/remotes/origin/verified-wp2-source)" = '9193326824b8b6bf774bdfa28e4783a1a1b8f304'

      - name: Disposable PostgreSQL, dependencies, Prisma client and migrations
        uses: ./.github/actions/ci-setup

      - name: Unit tests and coverage thresholds
        run: npm run test:coverage

  database:
    name: PostgreSQL database gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import fixed Preview source for staging contract tests
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/pull/277/head:refs/remotes/origin/verified-wp2-source
          test "$(git rev-parse refs/remotes/origin/verified-wp2-source)" = '9193326824b8b6bf774bdfa28e4783a1a1b8f304'

      - name: Disposable PostgreSQL, dependencies, Prisma client and migrations
        uses: ./.github/actions/ci-setup

      - name: Affiliate portal database boundaries
        run: npx vitest run --config vitest.affiliate-portal-db.config.ts
        env:
          COURSE_LEARNING_DISPOSABLE: verified-loopback
      - name: Native course database boundaries
        run: npx vitest run --config vitest.course-learning-db.config.ts
        env:
          COURSE_LEARNING_DISPOSABLE: verified-loopback

      - name: Course community database boundaries
        run: npx vitest run --config vitest.course-community-db.config.ts
        env:
          COURSE_LEARNING_DISPOSABLE: verified-loopback

      - name: PostgreSQL concurrency tests
        shell: bash
        run: |
          base_url="${DATABASE_URL%\?schema=public}"
          wp17_base_url="${base_url%/*}/celebratedeal_wp17_ci"
          wp18_base_url="${base_url%/*}/celebratedeal_wp18_ci"
          wp17_url="${wp17_base_url}?schema=wp17_ci"
          wp18_url="${wp18_base_url}?schema=wp18_ci"
          psql "$base_url" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE celebratedeal_wp17_ci'
          psql "$base_url" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE celebratedeal_wp18_ci'
          psql "$wp17_base_url" -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA wp17_ci'
          psql "$wp18_base_url" -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA wp18_ci'
          psql "$wp17_base_url" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm WITH SCHEMA wp17_ci'
          psql "$wp18_base_url" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm WITH SCHEMA wp18_ci'
          DATABASE_URL="$wp17_url" DIRECT_URL="$wp17_url" npm run db:migrate:deploy
          DATABASE_URL="$wp18_url" DIRECT_URL="$wp18_url" npm run db:migrate:deploy
          # A broken disposable connection must fail the gate rather than
          # leave the entire required CI workflow running indefinitely. This
          # is a hard timeout around the unchanged full suite, not a retry,
          # exclusion, or relaxed assertion.
          WP17_COVERAGE_DATABASE_URL="$wp17_url" WP17_COVERAGE_DIRECT_URL="$wp17_url" WP17_COVERAGE_DISPOSABLE_SCHEMA="wp17_ci" WP18_COVERAGE_DATABASE_URL="$wp18_url" WP18_COVERAGE_DIRECT_URL="$wp18_url" WP18_COVERAGE_DISPOSABLE_SCHEMA="wp18_ci" timeout --preserve-status 10m npm run test:db:concurrency

      - name: Learner notification database boundaries
        run: node --import tsx scripts/learner-notification-disposable-qa.mjs

      - name: Q1 original refund proof database isolation
        run: node scripts/q1-original-refund-proof-disposable-qa.mjs

      - name: Q1 original refund reservation database isolation
        run: node scripts/q1-original-refund-target-disposable-qa.mjs

  release-browser:
    name: Release browser gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import fixed Preview source for staging contract tests
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/pull/277/head:refs/remotes/origin/verified-wp2-source
          test "$(git rev-parse refs/remotes/origin/verified-wp2-source)" = '9193326824b8b6bf774bdfa28e4783a1a1b8f304'

      - name: Disposable PostgreSQL, dependencies, Prisma client and migrations
        uses: ./.github/actions/ci-setup

      - name: Playwright Chromium
        uses: ./.github/actions/playwright-chromium

      - name: Release browser gates
        run: npm run e2e -- --fail-on-flaky-tests
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:31023

  browser-gates:
    name: Database and browser gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import fixed Preview source for staging contract tests
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/pull/277/head:refs/remotes/origin/verified-wp2-source
          test "$(git rev-parse refs/remotes/origin/verified-wp2-source)" = '9193326824b8b6bf774bdfa28e4783a1a1b8f304'

      - name: Disposable PostgreSQL, dependencies, Prisma client and migrations
        uses: ./.github/actions/ci-setup

      - name: Playwright Chromium
        uses: ./.github/actions/playwright-chromium

      - name: Tracking authoritative events database and browser gate
        run: node scripts/tracking-settings-disposable-qa.mjs --browser

      - name: Referral sharing database and browser gate
        run: node scripts/affiliate-portal-browser-qa.mjs --browser

      - name: Funnel development harness browser gate
        run: node scripts/funnel-elements-browser-qa.mjs

      # Recovery requires its own verified loopback database, exact source and sandbox keys.
      - name: Subscription recovery database and browser gate
        run: node scripts/subscription-recovery-disposable-qa.mjs --browser

  # Branch protection requires this exact check name. It always runs and
  # fails unless every parallel job succeeded, so a failed, cancelled or
  # skipped job can never leave `quality` skipped (which would satisfy the
  # required check).
  quality:
    name: quality
    if: always()
    needs: [static, unit, database, release-browser, browser-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS_JSON"
          jq -e 'length == 5 and all(.[]; .result == "success")' <<<"$NEEDS_JSON" >/dev/null
