# AI Team vNext: routing policy is canonical in .ai-team/config/routing-policy.json.
# The version-controlled launcher rebuilds the ignored runtime when needed.
[mcp_servers.ai_team_router]
command = "pwsh"
args = ["-NoProfile", "-File", ".ai-team/scripts/Start-AiTeamMcp.ps1"]
cwd = "."
startup_timeout_sec = 120
tool_timeout_sec = 15
enabled = false # Live Desktop MCP startup is not verified; the Python CLI adapter remains available.
required = false
default_tools_approval_mode = "prompt"
enabled_tools = ["router_status", "route_task", "snapshot_task", "assess_task", "goal_bootstrap", "goal_get_state", "goal_checkpoint", "goal_resume", "goal_finalize"]

[mcp_servers.ai_team_router.tools.router_status]
approval_mode = "auto"

[mcp_servers.ai_team_router.tools.route_task]
approval_mode = "auto"

[mcp_servers.ai_team_router.tools.goal_get_state]
approval_mode = "auto"

[mcp_servers.ai_team_router.tools.goal_resume]
approval_mode = "auto"

[mcp_servers.ai_team_router.tools.goal_bootstrap]
approval_mode = "prompt"

[mcp_servers.ai_team_router.tools.goal_checkpoint]
approval_mode = "prompt"

[mcp_servers.ai_team_router.tools.goal_finalize]
approval_mode = "prompt"
