<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#060b18" flood-opacity=".45"/></filter>
</defs>
<circle cx="380" cy="118" r="120" fill="url(#halo)"/>
<path d="M400 58 a64 64 0 1 0 50 104 a52 52 0 1 1 -50 -104 Z" fill="#f2d27a"/>
