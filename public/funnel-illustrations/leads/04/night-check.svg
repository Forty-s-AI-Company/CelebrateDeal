<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600" font-family="'LXGW WenKai TC','Noto Sans TC','PingFang TC',sans-serif">
<title>夜空月亮與睡眠自我檢測表示意：題目與勾選框</title>
<defs>
