<text x="420" y="250" font-size="14" fill="#d9ece5" text-anchor="end">10 題</text>
<g font-size="16" fill="#1b2a2a">
<text x="100" y="314">1. 躺下後超過 30 分鐘還睡不著</text>
<g transform="translate(100 326)"><rect width="74" height="28" rx="14" fill="#2f6b5b"/><text x="37" y="19" font-size="13" fill="#fff" text-anchor="middle">常常</text><rect x="84" width="74" height="28" rx="14" fill="none" stroke="#b9c4bf" stroke-width="1.6"/><text x="121" y="19" font-size="13" fill="#3c4a48" text-anchor="middle">偶爾</text><rect x="168" width="74" height="28" rx="14" fill="none" stroke="#b9c4bf" stroke-width="1.6"/><text x="205" y="19" font-size="13" fill="#3c4a48" text-anchor="middle">很少</text></g>
<text x="100" y="392">2. 睡前最後一件事是滑手機</text>
<g transform="translate(100 404)"><rect width="74" height="28" rx="14" fill="none" stroke="#b9c4bf" stroke-width="1.6"/><text x="37" y="19" font-size="13" fill="#3c4a48" text-anchor="middle">常常</text><rect x="84" width="74" height="28" rx="14" fill="#2f6b5b"/><text x="121" y="19" font-size="13" fill="#fff" text-anchor="middle">偶爾</text><rect x="168" width="74" height="28" rx="14" fill="none" stroke="#b9c4bf" stroke-width="1.6"/><text x="205" y="19" font-size="13" fill="#3c4a48" text-anchor="middle">很少</text></g>
<text x="100" y="470">3. 週末起床時間比平日晚兩小時</text>
<g transform="translate(100 482)"><rect width="74" height="28" rx="14" fill="none" stroke="#b9c4bf" stroke-width="1.6"/><text x="37" y="19" font-size="13" fill="#3c4a48" text-anchor="middle">常常</text><rect x="84" width="74" height="28" rx="14" fill="none" stroke="#b9c4bf" stroke-width="1.6"/><text x="121" y="19" font-size="13" fill="#3c4a48" text-anchor="middle">偶爾</text><rect x="168" width="74" height="28" rx="14" fill="none" stroke="#b9c4bf" stroke-width="1.6"/><text x="205" y="19" font-size="13" fill="#3c4a48" text-anchor="middle">很少</text></g>
</g>
<rect x="100" y="532" width="320" height="6" rx="3" fill="#e3e8e2"/><rect x="100" y="532" width="96" height="6" rx="3" fill="#2f6b5b"/>
