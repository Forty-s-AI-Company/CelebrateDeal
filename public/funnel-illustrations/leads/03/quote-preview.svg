<text x="712" y="440" font-size="18" font-weight="700" fill="#1f4fd6" text-anchor="end">47,250</text>
<g font-size="12" fill="#5b6b85"><text x="72" y="392">付款：簽約 50%、驗收 50%</text><text x="72" y="414">超出範圍的修改另行報價</text></g>
<rect x="72" y="428" width="120" height="26" rx="13" fill="#5ad1c3" fill-opacity=".25"/>
<text x="132" y="446" font-size="12" fill="#0f6b60" text-anchor="middle" font-weight="700">自動計算 ✓</text>
