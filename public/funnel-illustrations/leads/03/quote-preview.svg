<path d="M0 44 H800" stroke="#dde3ee"/>
<g font-size="14" fill="#3a4559"><text x="24" y="28">檔案</text><text x="74" y="28">編輯</text><text x="124" y="28">檢視</text><text x="174" y="28">插入</text></g>
<rect x="600" y="11" width="84" height="24" rx="12" fill="#1f4fd6"/><text x="642" y="28" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">共用</text>
<circle cx="712" cy="23" r="12" fill="#5ad1c3"/><circle cx="740" cy="23" r="12" fill="#0f1e36"/>
<rect x="40" y="68" width="720" height="408" rx="8" fill="#ffffff" stroke="#dde3ee"/>
<rect x="40" y="68" width="720" height="8" rx="4" fill="#1f4fd6"/>
<text x="72" y="122" font-size="28" font-weight="700" fill="#0f1e36">報價單</text>
<text x="168" y="122" font-size="14" fill="#5b6b85" letter-spacing="3">QUOTATION</text>
<g font-size="13" fill="#3a4559">
<text x="72" y="152">客戶：範例設計有限公司</text>
<text x="72" y="174">專案：品牌官網改版</text>
<text x="728" y="152" text-anchor="end">報價編號 Q-0042</text>
<text x="728" y="174" text-anchor="end">有效期限 14 天</text>
</g>
<rect x="72" y="196" width="656" height="34" fill="#0f1e36"/>
<g font-size="13" fill="#ffffff" font-weight="700"><text x="88" y="218">項目</text><text x="420" y="218">工時</text><text x="520" y="218">單價</text><text x="712" y="218" text-anchor="end">小計</text></g>
<g font-size="14" fill="#0f1e36">
