<text x="88" y="254">需求訪談與網站架構</text><text x="420" y="254">6</text><text x="520" y="254">1,500</text><text x="712" y="254" text-anchor="end">9,000</text>
<text x="88" y="292">視覺設計（首頁＋5 內頁）</text><text x="420" y="292">20</text><text x="520" y="292">1,500</text><text x="712" y="292" text-anchor="end">30,000</text>
<rect x="72" y="306" width="656" height="38" fill="#f5f7fb"/>
<text x="88" y="330">修改兩次（含在報價內）</text><text x="420" y="330">4</text><text x="520" y="330">1,500</text><text x="712" y="330" text-anchor="end">6,000</text>
</g>
<path d="M72 344 H728" stroke="#dde3ee"/>
<g font-size="14" fill="#3a4559"><text x="520" y="376">未稅小計</text><text x="712" y="376" text-anchor="end">45,000</text><text x="520" y="402">營業稅 5%</text><text x="712" y="402" text-anchor="end">2,250</text></g>
