<g><rect x="70" y="40" width="440" height="560" rx="10" fill="#ffffff" stroke="#e3ddd6"/><rect x="510" y="70" width="34" height="54" rx="5" fill="#a64a32"/><text x="527" y="102.0" font-size="14" fill="#fff" text-anchor="middle">年</text><rect x="510" y="130" width="34" height="54" rx="5" fill="#c98a5e"/><text x="527" y="162.0" font-size="14" fill="#fff" text-anchor="middle">月</text><rect x="510" y="190" width="34" height="54" rx="5" fill="#7d8b6a"/><text x="527" y="222.0" font-size="14" fill="#fff" text-anchor="middle">週</text><rect x="510" y="250" width="34" height="54" rx="5" fill="#5f7f8f"/><text x="527" y="282.0" font-size="14" fill="#fff" text-anchor="middle">日</text><rect x="510" y="310" width="34" height="54" rx="5" fill="#9a8aa6"/><text x="527" y="342.0" font-size="14" fill="#fff" text-anchor="middle">習</text>
